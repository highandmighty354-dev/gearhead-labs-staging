    }

    # verify_files DIR MANIFEST: exactly the 21 approved names (no other file, folder or link), every hash equal.
    verify_files() {
      local dir="$1" man="$2" expected actual
      [ -d "$dir" ] && [ ! -L "$dir" ] || fail "migration folder $dir is missing or is a link"
      [ "$(grep -c . "$man")" = 21 ] || fail "the manifest does not have exactly 21 entries"
      expected="$(awk '{print $2}' "$man" | sort)"
      actual="$(find "$dir" -mindepth 1 -printf '%P\n' | sort)"
      [ "$expected" = "$actual" ] || { diff <(echo "$expected") <(echo "$actual") >&2 || true; fail "$dir does not hold exactly the 21 approved files"; }
      [ -z "$(find "$dir" -mindepth 1 ! -type f)" ] || fail "$dir contains something that is not a regular file"
      ( cd "$dir" && sha256sum --strict --quiet -c "$man" ) || fail "a migration file's SHA-256 does not match the approved hash"
    }

    # stage_files STAGE MANIFEST: the files of one stage, in apply order.
    stage_files() {
      case "$1" in
        1) awk '{print $2}' "$2" | sort | grep -E '^0([0-3][0-9]{2}|40[0-9])_' ;;   # 0001-0409: 19 files
        2) awk '{print $2}' "$2" | sort | grep -E '^0([0-3][0-9]{2}|40[0-9]|410)_' ;;   # 0001-0410: 20 files; 0410 is the only new one
        3) awk '{print $2}' "$2" | sort ;;                                         # all 21: 0501 is the only new one
        *) fail "unknown stage '$1'" ;;
      esac
    }
    # expected_pending STAGE MANIFEST: exactly what the CLI must report as pending for that stage.
    expected_pending() {
      case "$1" in
        1) stage_files 1 "$2" ;;
        2) echo "0410_formula_versions_stage2_calculator_repairs.sql" ;;
        3) echo "0501_analytics.sql" ;;
        *) fail "unknown stage '$1'" ;;
      esac
    }
    # expected_history_before / _after STAGE MANIFEST: the recorded versions the database must show.
    versions_of() { sed -E 's/^([0-9]{4})_.*/\1/'; }
    expected_history_before() { case "$1" in 1) : ;; 2) stage_files 1 "$2" | versions_of ;; 3) stage_files 2 "$2" | versions_of ;; esac; }
    expected_history_after()  { stage_files "$1" "$2" | versions_of; }

    # build_stage_dir STAGE MANIFEST WORKDIR: copies ONLY that stage's files, unchanged, into WORKDIR/supabase/migrations,
    # makes the folder read-only, and writes WORKDIR.sha256 (the hashes of exactly those files).
    build_stage_dir() {
      local stage="$1" man="$2" work="$3" f
      [ ! -e "$work" ] || fail "$work already exists"
      mkdir -p "$work/supabase/migrations"
      stage_files "$stage" "$man" > "$work.files"
      while IFS= read -r f; do cp "supabase/migrations/$f" "$work/supabase/migrations/$f"; done < "$work.files"
      grep -F -f "$work.files" "$man" > "$work.sha256"
      [ "$(wc -l < "$work.sha256")" = "$(wc -l < "$work.files")" ] || fail "stage $stage hash list is incomplete"
      chmod -R a-w "$work/supabase/migrations"
      verify_stage_dir "$work"
    }
    # verify_stage_dir WORKDIR: run before EVERY CLI command. The migrations folder the CLI executes from holds exactly
    # this stage's files, every hash still matches, and nothing else exists except the CLI's own cache folder
    # supabase/.temp (the CLI 2.119.0 writes supabase/.temp/cli-latest there; it holds no SQL and is never executed).
    verify_stage_dir() {
      local work="$1" listing want
      [ -z "$(find "$work" -mindepth 1 -maxdepth 1 ! -name supabase)" ] || fail "unexpected file next to the stage's supabase folder"
      listing="$(find "$work/supabase" -mindepth 1 -path "$work/supabase/.temp" -prune -o -printf '%P\n' | sort)"
      want="$( { echo migrations; sed 's#^#migrations/#' "$work.files"; } | sort)"
      [ "$listing" = "$want" ] || fail "the folder the CLI reads holds something other than this stage's files"
      [ -z "$(find "$work/supabase/migrations" -mindepth 1 ! -type f)" ] || fail "the stage's migrations folder holds a non-file"
      ( cd "$work/supabase/migrations" && sha256sum --strict --quiet -c "$work.sha256" ) || fail "a file the CLI would execute does not match its approved hash"
    }

    # --- C. The staging target, checked four ways (no secret involved) ------------------------------
    # 1 EXPECTED_TEST_REF  repository variable (20 chars a-z 0-9)   2 STAGING_POOLER_URL  repository variable (no password in it)
    # 3 CONFIRM_REF        typed into this run              4 supabase-config.js  the staging website's own setting
    verify_target() {
      local expected="${EXPECTED_TEST_REF:-}" typed="${CONFIRM_REF:-}" url="${POOLER_URL:-}" ref cfg site_refs
      [ -n "$expected" ] || fail "variable EXPECTED_TEST_REF is not set: the target cannot be verified"
      [ -n "$url" ]      || fail "variable STAGING_POOLER_URL is not set: the target cannot be verified"
      [ -n "$typed" ]    || fail "no project ref was typed: the target cannot be verified"
      [[ $expected =~ ^[a-z0-9]{20}$ ]] || fail "EXPECTED_TEST_REF is not a 20-character project ref (lowercase letters and digits only)"
      [ "$expected" != "$PRODUCTION_REF" ] || fail "EXPECTED_TEST_REF is the PRODUCTION project"
      [ "$typed" != "$PRODUCTION_REF" ]    || fail "the typed ref is the PRODUCTION project"
      case "$url" in *"$PRODUCTION_REF"*) fail "STAGING_POOLER_URL names the PRODUCTION project" ;; esac
      ref="$(printf '%s' "$url" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]{20}):\[YOUR-PASSWORD\]@aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com:5432/postgres$#\2#p')"
      [ -n "$ref" ] || fail "STAGING_POOLER_URL is not an unmodified Session pooler string: postgres.<ref>:[YOUR-PASSWORD]@aws-N-<region>.pooler.supabase.com:5432/postgres"
      [ "$ref" = "$expected" ] || fail "STAGING_POOLER_URL is for project $ref, not EXPECTED_TEST_REF $expected"
      [ "$typed" = "$expected" ] || fail "the typed ref does not match EXPECTED_TEST_REF"
      cfg="supabase-config.js"
      [ -f "$cfg" ] && [ ! -L "$cfg" ] || fail "$cfg is missing: the target cannot be cross-checked"
      grep -qF "$PRODUCTION_REF" "$cfg" && fail "$cfg names the PRODUCTION project"
      site_refs="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' "$cfg" | sort -u)"
      [ "$site_refs" = "https://$expected.supabase.co" ] || fail "$cfg must name exactly one project, https://$expected.supabase.co (found: ${site_refs:-none})"
      echo "$ref"
    }

    # --- D. Reading the database's migration history (needs DB_URL) --------------------------------
    history_versions() {
      local exists
      exists="$(psql "$DB_URL" -X -A -t -q -v ON_ERROR_STOP=1 -c "select to_regclass('supabase_migrations.schema_migrations') is not null")" \
        || fail "could not read the database (connection or permission error)"
      case "$exists" in
        f) : ;;
        t) psql "$DB_URL" -X -A -t -q -v ON_ERROR_STOP=1 -c "select version from supabase_migrations.schema_migrations order by version" \
             || fail "could not read the migration history" ;;
        *) fail "unexpected answer while checking for the migration history: '$exists'" ;;
      esac
    }

    # --- E. Strict reader for `supabase db push --dry-run` output (CLI 2.119.0) ---------------------
    exact_pending_gate() {
      local out="$1" expected="$2" clean line state=none n_head n_up n_bul
      local dry='DRY RUN: migrations will *not* be pushed to the database.'
      local head='Would push these migrations:' up='Remote database is up to date.'
      local re='^ • ([0-9]{4}_[a-z0-9_]+\.sql)$'
      local -a pending=()
      [ -s "$out" ] || fail "the CLI printed nothing"
      clean="$(sed -e $'s/\x1b\\[[0-9;]*[A-Za-z]//g' -e $'s/\r$//' "$out")"
      [ "$(printf '%s\n' "$clean" | grep -cxF -- "$dry" || true)" = 1 ] || fail "the CLI output does not confirm a dry run"
      printf '%s\n' "$clean" | grep -qE '^Would (seed|create)' && fail "the dry run would also seed data or create roles"
      n_head="$(printf '%s\n' "$clean" | grep -cxF -- "$head" || true)"
      n_up="$(printf '%s\n' "$clean" | grep -cxF -- "$up" || true)"
      [ "$n_up" = 0 ] || fail "the CLI reports the database already up to date: wrong project or wrong stage"
      [ "$n_head" = 1 ] || fail "the pending list cannot be read reliably"
      while IFS= read -r line; do
        if [ "$state" = none ]; then [ "$line" = "$head" ] && state=list; continue; fi
        if [ "$state" = list ]; then
          if [[ $line =~ $re ]]; then pending+=("${BASH_REMATCH[1]}"); else state=ended; fi
        fi
      done <<< "$clean"
      n_bul="$(printf '%s\n' "$clean" | grep -c '^ • ' || true)"
      [ "${#pending[@]}" -gt 0 ] || fail "the pending list is empty or malformed"
      [ "$n_bul" = "${#pending[@]}" ] || fail "list entries appear outside the pending list"
      printf 'pending: %s\n' "${pending[@]}"
      [ "$(printf '%s\n' "${pending[@]}")" = "$expected" ] || fail "the CLI's pending files are not exactly this stage's files"
      echo "gate: PASS ${#pending[@]} file(s) pending, exactly as expected"
    }
    uptodate_gate() {
      local clean
      [ -s "$1" ] || fail "the verification dry run printed nothing"
      clean="$(sed -e $'s/\x1b\\[[0-9;]*[A-Za-z]//g' -e $'s/\r$//' "$1")"
      [ "$(printf '%s\n' "$clean" | grep -cxF -- 'DRY RUN: migrations will *not* be pushed to the database.' || true)" = 1 ] || fail "the verification is not a dry run"
      [ "$(printf '%s\n' "$clean" | grep -cxF -- 'Remote database is up to date.' || true)" = 1 ] || fail "the database is not positively reported up to date"
      printf '%s\n' "$clean" | grep -q '^ • ' && fail "files are still pending"
      echo "gate: PASS nothing pending"
    }

    # --- F. Progress report: which of this stage's migrations the database has recorded -------------
    report_progress() {
      local stage="$1" man="$2" recorded v f
      recorded="$(history_versions)"
      echo "#### Migration history now recorded for stage $stage"
      while IFS= read -r f; do
        v="${f%%_*}"
        if printf '%s\n' "$recorded" | grep -qxF -- "$v"; then echo "- [x] $f - recorded as applied"; else echo "- [ ] $f - NOT recorded"; fi
      done < <(stage_files "$stage" "$man")
    }

    # --- G. TLS: pinned Supabase roots, certificate chain + hostname (verify-full) ----------------------
    # pooler_host: the host part of the already-verified STAGING_POOLER_URL.
    pooler_host() {
      printf '%s' "${POOLER_URL:-}" | sed -nE 's#^postgres(ql)?://postgres\.[a-z0-9]{20}:\[YOUR-PASSWORD\]@(aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com):5432/postgres$#\2#p'
    }
    # write_ca FILE: writes the pinned roots and refuses unless the file holds exactly the two pinned certificates.
    write_ca() {
      local file="$1" got
      printf '%s' "$SUPABASE_ROOT_CA_PEM" > "$file"
      [ "$(grep -c -- '-----BEGIN CERTIFICATE-----' "$file")" = 2 ] || fail "the pinned CA bundle does not hold exactly 2 certificates"
      got="$(python3 - "$file" <<'PYEOF'
    import hashlib, re, ssl, sys
    pem = open(sys.argv[1]).read()
    blocks = re.findall(r"-----BEGIN CERTIFICATE-----\n.*?\n-----END CERTIFICATE-----", pem, re.S)
    print(" ".join(sorted(hashlib.sha256(ssl.PEM_cert_to_DER_cert(b + "\n")).hexdigest().upper() for b in blocks)))
    PYEOF
    )" || fail "the pinned CA bundle could not be read"
      [ "$got" = "$SUPABASE_ROOT_CA_SHA256_FINGERPRINTS" ] || fail "the CA bundle's certificate fingerprints are not the two pinned Supabase roots"
      chmod a-w "$file"
    }
    # tls_probe HOST CAFILE: no password involved. The pooler must complete a TLS handshake whose certificate chains to
    # a pinned root and names HOST; system CA stores are not consulted. Any failure stops the run.
    tls_probe() {
      local host="$1" ca="$2" out rc=0
      [ -n "$host" ] || fail "no pooler host to check: the target cannot be verified"
      out="$(timeout 30 openssl s_client -starttls postgres -connect "$host:5432" -servername "$host" \
               -verify_hostname "$host" -verify_return_error -CAfile "$ca" -no-CApath -no-CAstore -brief < /dev/null 2>&1)" || rc=$?
      printf '%s\n' "$out" | sed 's/^/  tls: /' >&2
      [ "$rc" -eq 0 ] || fail "TLS check of $host failed: the certificate is not from a pinned Supabase root, does not name $host, has expired, or TLS is not offered"
      printf '%s\n' "$out" | grep -qx 'Verification: OK' || fail "TLS check of $host did not report 'Verification: OK'"
      # OpenSSL prints "Verified peername" only after -verify_hostname matched; for a wildcard certificate it prints
      # the certificate name that matched (e.g. *.pooler.supabase.com), not $host, so only its presence is required.
      printf '%s\n' "$out" | grep -q '^Verified peername: [^ ]' || fail "TLS check of $host did not confirm the hostname"
      echo "TLS OK: $host presents a certificate chaining to a pinned Supabase root and naming $host"
    }

    # --- H. The approval gate, read back from GitHub (read-only; no secret involved) ------------------
    # Refuses unless Environment APPROVAL_ENVIRONMENT exists with exactly: one required-reviewers rule whose only
    # reviewer is APPROVER_LOGIN, self-review prevention OFF (one-owner setup: ON would deadlock), and deployments
    # limited to exactly one branch pattern, "main". Administrator bypass is NOT exposed by GitHub's API; it is a
    # manual setting (see the plan).
    check_environment() {
      local api="${GITHUB_API_URL:-}" base
      [[ $api == https://* ]] || fail "GITHUB_API_URL is not an https address: the approval gate cannot be verified"
      [ -n "${GH_TOKEN:-}" ] || fail "no read token: the approval gate cannot be verified"
      base="$api/repos/$REPO/environments/$APPROVAL_ENVIRONMENT"
      curl --fail --silent --show-error --proto '=https' -H "Authorization: Bearer $GH_TOKEN" \
           -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
           -o "$RUNNER_TEMP/env.json" "$base" \
        || fail "could not read Environment $APPROVAL_ENVIRONMENT (missing, or GitHub unreachable): the approval gate cannot be verified"
      curl --fail --silent --show-error --proto '=https' -H "Authorization: Bearer $GH_TOKEN" \
           -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
           -o "$RUNNER_TEMP/env-branches.json" "$base/deployment-branch-policies" \
        || fail "could not read the branch rule of $APPROVAL_ENVIRONMENT: the approval gate cannot be verified"
      python3 - "$RUNNER_TEMP/env.json" "$RUNNER_TEMP/env-branches.json" <<'PYEOF' || fail "Environment $APPROVAL_ENVIRONMENT is not configured as required (see the message above)"
    import json, os, sys
    env = json.load(open(sys.argv[1])); br = json.load(open(sys.argv[2]))
    want_env, approver = os.environ["APPROVAL_ENVIRONMENT"], os.environ["APPROVER_LOGIN"]
    def no(msg): print("HARD FAIL: " + msg, file=sys.stderr); sys.exit(1)
    if env.get("name") != want_env: no(f"the Environment read back is {env.get('name')!r}, not {want_env!r}")
    rules = env.get("protection_rules") or []
    kinds = [r.get("type") for r in rules]
    unknown = sorted(set(kinds) - {"required_reviewers", "branch_policy", "wait_timer"})
    if unknown: no(f"unexpected protection rule type(s) {unknown}: review the Environment before running")
    rr = [r for r in rules if r.get("type") == "required_reviewers"]
    if len(rr) != 1: no("the Environment has no required-reviewers rule (every run must wait for approval)")
    if rr[0].get("prevent_self_review") is not False:
        no("'Prevent self-review' must be OFF: with one owner as the only reviewer, ON means no run can ever be approved")
    revs = [(x.get("type"), (x.get("reviewer") or {}).get("login")) for x in (rr[0].get("reviewers") or [])]
    if revs != [("User", approver)]: no(f"required reviewers must be exactly the user {approver}; found {revs}")
    if "branch_policy" not in kinds: no("the Environment has no branch rule (any branch could use it)")
    if env.get("deployment_branch_policy") != {"protected_branches": False, "custom_branch_policies": True}:
        no(f"deployment branches must be 'Selected branches and tags'; found {env.get('deployment_branch_policy')}")
    pols = [(p.get("name"), p.get("type", "branch")) for p in br.get("branch_policies", [])]
    if br.get("total_count") != 1 or pols != [("main", "branch")]: no(f"the only allowed deployment branch must be 'main'; found {pols}")
    print(f"Approval gate OK: {want_env} requires {approver}, self-review allowed (no deadlock), branch main only")
    PYEOF
    }

jobs:
  preflight:
    name: Preflight checks (no approval needed, no secret)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read    # read-only: lets the token read this repository's Environment protection settings
    env:
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      GIT_REF: ${{ github.ref }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      STAGE: ${{ inputs.stage }}
      MODE: ${{ inputs.mode }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
    steps:
      - name: Check how the run was started and what was typed
        run: |
          printf '%s\n' "$CHECKS_SH" > "$RUNNER_TEMP/checks.sh"; . "$RUNNER_TEMP/checks.sh"
          check_context
          echo "Context OK: manual start, $REPO, main, first attempt, stage $STAGE, $MODE."

      - name: Check out this exact commit (read-only, no stored credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the 21 files and the staging target
        env:
          EXPECTED_TEST_REF: ${{ vars.EXPECTED_TEST_REF }}
          POOLER_URL: ${{ vars.STAGING_POOLER_URL }}
          CONFIRM_REF: ${{ inputs.confirm_project_ref }}
          COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' "$CHECKS_SH" > "$RUNNER_TEMP/checks.sh"; . "$RUNNER_TEMP/checks.sh"
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || fail "checked-out commit is not the run's commit"
          write_manifest "$RUNNER_TEMP/manifest.sha256"
          verify_files supabase/migrations "$RUNNER_TEMP/manifest.sha256"
          ref="$(verify_target)"
          {
            echo "### Preflight passed - stage $STAGE $MODE"
            echo "- Commit: \`$COMMIT\` (0001-0410 copied from PR #31 at \`$SOURCE_COMMIT\`; 0501 from gearhead-labs main at \`$SOURCE_COMMIT_0501\`)"
            echo "- 21 migration files present, no others; all 21 SHA-256 hashes match"
            echo "- Target: staging project \`$ref\` (variable, pooler URL, typed ref and supabase-config.js agree; production \`$PRODUCTION_REF\` refused)"
            echo "- Next: the migrate job waits for your approval in the staging-db Environment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the approval gate settings (read-only, no secret)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . "$RUNNER_TEMP/checks.sh"
          check_environment | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the database's TLS certificate and hostname (no password)
        env:
          EXPECTED_TEST_REF: ${{ vars.EXPECTED_TEST_REF }}
          POOLER_URL: ${{ vars.STAGING_POOLER_URL }}
          CONFIRM_REF: ${{ inputs.confirm_project_ref }}
        run: |
          . "$RUNNER_TEMP/checks.sh"
          verify_target > /dev/null
          write_ca "$RUNNER_TEMP/supabase-root-ca.pem"
          tls_probe "$(pooler_host)" "$RUNNER_TEMP/supabase-root-ca.pem" | tee -a "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Stage ${{ inputs.stage }} ${{ inputs.mode }} - staging database
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging-db    # required reviewer = you; main branch only. Nothing below starts until you approve.
    permissions:
      contents: read
      actions: read    # read-only: lets the token read this repository's Environment protection settings
    env:
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      GIT_REF: ${{ github.ref }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      STAGE: ${{ inputs.stage }}
      MODE: ${{ inputs.mode }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
      EXPECTED_TEST_REF: ${{ vars.EXPECTED_TEST_REF }}
      POOLER_URL: ${{ vars.STAGING_POOLER_URL }}
      CONFIRM_REF: ${{ inputs.confirm_project_ref }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Repeat the context and approval-gate checks (no secret in this step)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$CHECKS_SH" > "$RUNNER_TEMP/checks.sh"; . "$RUNNER_TEMP/checks.sh"
          check_context
          check_environment

      - name: Check out the same commit preflight checked
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Re-verify files and target, build the read-only stage folder (no secret in this step)
        run: |
          . "$RUNNER_TEMP/checks.sh"
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || fail "checked-out commit is not the run's commit"
          write_manifest "$RUNNER_TEMP/manifest.sha256"
          verify_files supabase/migrations "$RUNNER_TEMP/manifest.sha256"
          verify_target > /dev/null
          build_stage_dir "$STAGE" "$RUNNER_TEMP/manifest.sha256" "$RUNNER_TEMP/stage$STAGE"
          echo "Stage $STAGE folder: $(wc -l < "$RUNNER_TEMP/stage$STAGE.files") file(s), hashes verified, read-only."

      - name: Install Supabase CLI 2.119.0, hash-pinned (no secret in this step)
        run: |
          . "$RUNNER_TEMP/checks.sh"
          d="$RUNNER_TEMP/supabase-cli"; mkdir -p "$d"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
               -o "$d/cli.tar.gz" "$SUPABASE_CLI_URL" || fail "CLI download failed"
          echo "$SUPABASE_CLI_SHA256  $d/cli.tar.gz" | sha256sum --strict --quiet -c - || fail "the CLI download does not match the pinned SHA-256"
          tar -xzf "$d/cli.tar.gz" -C "$d" supabase supabase-go || fail "the CLI archive does not contain the expected two programs"
          [ "$("$d/supabase" --version)" = "$SUPABASE_CLI_VERSION" ] || fail "the CLI does not report version $SUPABASE_CLI_VERSION"
          command -v psql > /dev/null || fail "psql is not available on this runner: history checks impossible"
          echo "$d" >> "$GITHUB_PATH"
          echo "Supabase CLI $SUPABASE_CLI_VERSION installed (archive SHA-256 verified)."

      - name: Re-check the database's TLS certificate and hostname (no secret in this step)
        run: |
          . "$RUNNER_TEMP/checks.sh"
          write_ca "$RUNNER_TEMP/supabase-root-ca.pem"
          tls_probe "$(pooler_host)" "$RUNNER_TEMP/supabase-root-ca.pem"

      - name: Stage ${{ inputs.stage }} ${{ inputs.mode }} (the only step that receives the password)
        env:
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          . "$RUNNER_TEMP/checks.sh"
          man="$RUNNER_TEMP/manifest.sha256"; work="$RUNNER_TEMP/stage$STAGE"
          [ -n "${DB_PASSWORD:-}" ] || fail "Environment secret STAGING_DB_PASSWORD is not set"
          CA_FILE="$RUNNER_TEMP/db-ca.pem"
          write_ca "$CA_FILE"

          # 1) Connection string, built here only, masked before anything else is printed. Every connection made with it
          #    (psql and the CLI) uses sslmode=verify-full against the pinned roots only: no plaintext, no unverified TLS.
          enc="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')"
          echo "::add-mask::$enc"
          DB_URL="${POOLER_URL/\[YOUR-PASSWORD\]/$enc}?sslmode=verify-full&sslrootcert=$CA_FILE"
          echo "::add-mask::$DB_URL"
          unset DB_PASSWORD enc
          case "$DB_URL" in *"$PRODUCTION_REF"*) fail "the final connection string names the PRODUCTION project" ;; esac
          case "$DB_URL" in "postgresql://postgres.$EXPECTED_TEST_REF:"*|"postgres://postgres.$EXPECTED_TEST_REF:"*) ;; *) fail "the final connection string is not for $EXPECTED_TEST_REF" ;; esac
          case "$DB_URL" in *"@$(pooler_host):5432/postgres?sslmode=verify-full&sslrootcert=$CA_FILE") ;; *) fail "the final connection string does not require verify-full against the pinned roots" ;; esac
          [ "$(printf '%s' "$DB_URL" | grep -o 'sslmode=' | wc -l)" = 1 ] || fail "the final connection string sets sslmode more than once"
          export DB_URL PGSSLMODE=verify-full PGSSLROOTCERT="$CA_FILE"

          # 2) Sequencing: the recorded history must be exactly what this stage expects BEFORE it runs.
          before="$(history_versions)"
          [ "$before" = "$(expected_history_before "$STAGE" "$man")" ] \
            || fail "stage $STAGE cannot start: the database's recorded history is not what this stage requires (stage 1 needs an empty history; stage 2 needs exactly 0001-0409; stage 3 needs exactly 0001-0410)"

          # 3) Dry run from the verified, read-only stage folder.
          cd "$work"
          verify_stage_dir "$work"
          rc=0; supabase db push --dry-run --db-url "$DB_URL" > "$RUNNER_TEMP/dry.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/dry.txt"
          [ "$rc" -eq 0 ] || fail "the CLI dry run exited with status $rc"
          exact_pending_gate "$RUNNER_TEMP/dry.txt" "$(expected_pending "$STAGE" "$man")" | tee "$RUNNER_TEMP/gate.txt"
          {
            echo "### Stage $STAGE $MODE - staging project \`$EXPECTED_TEST_REF\`"
            echo "- Commit \`$COMMIT\`; Supabase CLI $SUPABASE_CLI_VERSION (archive SHA-256 verified)"
            echo "- Files the CLI reads (SHA-256 verified before every CLI command):"
            # shellcheck disable=SC2016  # the backticks are Markdown for the summary, not shell
            sed -E 's/^([0-9a-f]{64})  (.*)$/  - \2 `\1`/' "$work.sha256"
            echo "- Pending, from the CLI's own dry-run list:"
            sed -n 's/^pending: /  - /p' "$RUNNER_TEMP/gate.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = dry-run ]; then
            echo "Dry run only: no database changes were made." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 4) Apply: one attempt, same folder, files re-verified first. No retry, no continue-on-error.
          verify_stage_dir "$work"
          rc=0; supabase db push --db-url "$DB_URL" --yes > "$RUNNER_TEMP/apply.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/apply.txt"

          # 5) Whatever happened, report what the database now records, file by file.
          report_progress "$STAGE" "$man" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            {
              echo
              echo "**Stage $STAGE FAILED (CLI exit status $rc).** Nothing was retried or rolled back. Files marked NOT recorded did not complete."
              echo "The failing file may have left part of its work behind (14 of the 21 files manage their own transactions), so treat the staging database as unknown:"
              echo "delete and recreate the staging project before any new attempt, which needs a new run, a new confirmation and a new approval."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            fail "stage $STAGE apply failed with CLI exit status $rc"
          fi

          # 6) Prove it finished: history exactly as expected and the CLI positively reports nothing pending.
          [ "$(history_versions)" = "$(expected_history_after "$STAGE" "$man")" ] || fail "after apply, the recorded history is not exactly this stage's expected list"
          verify_stage_dir "$work"
          rc=0; supabase db push --dry-run --db-url "$DB_URL" > "$RUNNER_TEMP/after.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/after.txt"
          [ "$rc" -eq 0 ] || fail "the verification dry run exited with status $rc"
          uptodate_gate "$RUNNER_TEMP/after.txt"
          echo "Stage $STAGE applied to \`$EXPECTED_TEST_REF\`; nothing pending. Next: report to the owner and STOP." | tee -a "$GITHUB_STEP_SUMMARY"
