# Gearhead Labs STAGING - apply PR #31's migrations to the staging Supabase project
# File: .github/workflows/staging-migrations.yml in highandmighty354-dev/gearhead-labs-staging ONLY.
#
# PROPOSAL FOR OWNER REVIEW, revision 4 (2026-11-23). Not committed; revision 3 (c1c3588e) is the committed version.
# Revision 3: project refs may contain digits ([a-z0-9]{20}); every database connection verifies TLS against the two
# pinned Supabase root CAs with hostname checking (verify-full), plus a TLS probe before the password exists; the
# staging-db Environment's protection settings are read from GitHub and must match before anything runs.
# Revision 4: the TLS probe accepts OpenSSL's verified wildcard peer name; OpenSSL still does the hostname check.
#
# What this workflow can do: apply the 21 approved migration files, in three stages, to the ONE Supabase
# project named in this repository's settings, after you approve each run.
# What it cannot do: anything on its own (manual start only), anything outside this repository (its token is
# read-only and scoped to this repository), or reach production (production's password is not in this repository).
#
# Order of every run:
#   preflight  (no Environment, no secret)  context checks, typed-confirmation checks, file hashes, four-way ref check,
#                                           Environment protection check, TLS certificate + hostname probe
#   migrate    (Environment staging-db)     WAITS FOR YOUR APPROVAL, then repeats every check in steps that have no
#                                           secret, installs the hash-pinned CLI, and only the last step receives
#                                           the staging database password.

name: Staging migrations (manual, approval-gated)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "1 = migrations 0001-0409 into the EMPTY staging project. 2 = migration 0410 only (needs stage 1 complete). 3 = migration 0501 only (needs 0410 recorded)."
        type: choice
        options: ["1", "2", "3"]
        required: true
      mode:
        description: "dry-run = report what would be applied, change nothing. apply = change the staging database."
        type: choice
        options: [dry-run, apply]
        default: dry-run
        required: true
      confirm_project_ref:
        description: "Type the STAGING project ref exactly (20 lowercase letters/digits). Production's ref is always refused."
        type: string
        required: true
      confirm_apply:
        description: "apply only: APPLY-STAGE-1 for stage 1, APPLY-STAGE-2 for stage 2, APPLY-STAGE-3 for stage 3. Must be EMPTY for dry-run."
        type: string
        required: false
        default: ""

# No permissions at workflow level; each job asks only for read access to this repository's files.
permissions: {}

# One run at a time; a queued run never cancels a running one.
concurrency:
  group: staging-migrations
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # GitHub runs this as: bash --noprofile --norc -eo pipefail {0}

