  # Shared checks, written to a file and sourced by every step that needs them. Pure shell: no network,
  # no secret. Every failure prints "HARD FAIL: <reason>" and exits non-zero, which stops the job.
  CHECKS_SH: |
    set -euo pipefail
    LC_ALL=C; export LC_ALL
    fail() { echo "::error::$*" >&2; echo "HARD FAIL: $*" >&2; exit 1; }

    # --- A. How this run was started, and what was typed --------------------------------------------
    check_context() {
      [ "${EVENT:-}" = workflow_dispatch ] || fail "started by '${EVENT:-?}', not by the Run workflow button"
      [ "${REPO:-}" = "$STAGING_REPOSITORY" ] || fail "running in '${REPO:-?}', not $STAGING_REPOSITORY"
      [ "${GIT_REF:-}" = refs/heads/main ] || fail "started from '${GIT_REF:-?}', not refs/heads/main"
      [ "${RUN_ATTEMPT:-}" = 1 ] || fail "this is re-run attempt ${RUN_ATTEMPT:-?}; re-runs are refused - start a new run (new confirmation, new approval)"
      case "${STAGE:-}" in 1|2|3) ;; *) fail "stage must be 1, 2 or 3, got '${STAGE:-}'" ;; esac
      case "${MODE:-}" in
        dry-run) [ -z "${CONFIRM_APPLY:-}" ] || fail "confirm_apply must be EMPTY for a dry run (got a value)" ;;
        apply)   [ "${CONFIRM_APPLY:-}" = "APPLY-STAGE-$STAGE" ] || fail "apply for stage $STAGE needs exactly APPLY-STAGE-$STAGE in confirm_apply" ;;
        *)       fail "mode must be dry-run or apply, got '${MODE:-}'" ;;
      esac
    }

    # --- B. The 21 approved files and their SHA-256 -------------------------------------------------
    # 0001-0409: the same 19 hashes production's provisioning workflow pins (commit c69ec51).
    # 0410: PR #31 at 62b8a65. 0501: gearhead-labs main at 215b1a0 (hash as in the hosted TEST procedure, revision 10).
    write_manifest() {
