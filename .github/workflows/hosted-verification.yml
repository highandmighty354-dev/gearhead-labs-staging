jobs:
  preflight:
    name: Preflight checks (no approval needed, no secret, no HTTP request)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read    # read-only: Environment protection settings and other runs' status
    env:
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      GIT_REF: ${{ github.ref }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_ID: ${{ github.run_id }}
      SUITE: ${{ inputs.suite }}
      EXPECTED_TEST_REF: ${{ vars.EXPECTED_TEST_REF }}
      POOLER_URL: ${{ vars.STAGING_POOLER_URL }}
      CONFIRM_REF: ${{ inputs.confirm_project_ref }}
      ANALYTICS_TEST_ORIGIN: ${{ vars.ANALYTICS_TEST_ORIGIN }}
      HV_PROBE_STATUS: ${{ vars.HV_PROBE_STATUS }}
      HV_RECEIVER_STATUS: ${{ vars.HV_RECEIVER_STATUS }}
      HV_TEST_WINDOW: ${{ vars.HV_TEST_WINDOW }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Check how the run was started (before checkout)
        run: |
          [ "$EVENT" = workflow_dispatch ] || { echo "HARD FAIL: not started by the Run workflow button" >&2; exit 1; }
          [ "$GIT_REF" = refs/heads/main ] || { echo "HARD FAIL: not started from main" >&2; exit 1; }
          [ "$RUN_ATTEMPT" = 1 ] || { echo "HARD FAIL: re-runs are refused; start a new run" >&2; exit 1; }

      - name: Check out this exact commit (read-only, no stored credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Context, target, origin and prerequisites
        run: |
          . .github/hosted-verification/checks.sh
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || fail "checked-out commit is not the run's commit"
          check_context
          ref="$(verify_target)"
          check_origin | tee "$RUNNER_TEMP/origin.txt"
          check_prerequisites | tee "$RUNNER_TEMP/prereq.txt"
          {
            echo "### Hosted verification preflight passed - suite $SUITE"
            echo "- Commit: \`$COMMIT\`; manual start from main, first attempt"
            echo "- Target: staging project \`$ref\` (variable, pooler URL, typed ref and supabase-config.js agree; production \`$PRODUCTION_REF\` refused)"
            echo "- $(cat "$RUNNER_TEMP/origin.txt")"
            echo "- $(cat "$RUNNER_TEMP/prereq.txt")"
            echo "- No HTTP request has been sent. Next: the verify job waits for your approval in the staging-db Environment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the approval gate settings and other runs (read-only, no secret)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .github/hosted-verification/checks.sh
          check_environment | tee -a "$GITHUB_STEP_SUMMARY"
          check_no_other_runs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the database's TLS certificate and hostname (no password)
        run: |
          . .github/hosted-verification/checks.sh
          verify_target > /dev/null
          write_ca "$RUNNER_TEMP/supabase-root-ca.pem"
          tls_probe "$(pooler_host)" "$RUNNER_TEMP/supabase-root-ca.pem" | tee -a "$GITHUB_STEP_SUMMARY"

  verify:
    name: Suite ${{ inputs.suite }} - staging project
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging-db    # required reviewer = you; main branch only. Nothing below starts until you approve.
    permissions:
      contents: read
      actions: read    # read-only: Environment protection settings and other runs' status
    env:
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      GIT_REF: ${{ github.ref }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_ID: ${{ github.run_id }}
      SUITE: ${{ inputs.suite }}
      EXPECTED_TEST_REF: ${{ vars.EXPECTED_TEST_REF }}
      POOLER_URL: ${{ vars.STAGING_POOLER_URL }}
      CONFIRM_REF: ${{ inputs.confirm_project_ref }}
      ANALYTICS_TEST_ORIGIN: ${{ vars.ANALYTICS_TEST_ORIGIN }}
      HV_PROBE_STATUS: ${{ vars.HV_PROBE_STATUS }}
      HV_RECEIVER_STATUS: ${{ vars.HV_RECEIVER_STATUS }}
      HV_TEST_WINDOW: ${{ vars.HV_TEST_WINDOW }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Check how the run was started (before checkout)
        run: |
          [ "$EVENT" = workflow_dispatch ] || { echo "HARD FAIL: not started by the Run workflow button" >&2; exit 1; }
          [ "$GIT_REF" = refs/heads/main ] || { echo "HARD FAIL: not started from main" >&2; exit 1; }
          [ "$RUN_ATTEMPT" = 1 ] || { echo "HARD FAIL: re-runs are refused; start a new run" >&2; exit 1; }

      - name: Check out the same commit preflight checked
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Repeat every check after approval (no secret in this step)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .github/hosted-verification/checks.sh
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] || fail "checked-out commit is not the run's commit"
          check_context
          verify_target > /dev/null
          check_origin
          check_prerequisites
          check_environment | tee "$RUNNER_TEMP/approval.txt"
          check_no_other_runs

      - name: Install the database driver, hash-pinned (no secret in this step)
        run: |
          . .github/hosted-verification/checks.sh
          python3 -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)' || fail "python3 on this runner is not 3.12: the pinned wheels do not apply"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps --only-binary :all: \
            -r .github/hosted-verification/requirements.txt || fail "the pinned database driver could not be installed"
          "$RUNNER_TEMP/venv/bin/python" -c 'import psycopg; print("psycopg", psycopg.__version__, "libpq", psycopg.pq.version())'

      - name: Re-check the database's TLS certificate and hostname (no secret in this step)
        run: |
          . .github/hosted-verification/checks.sh
          write_ca "$RUNNER_TEMP/supabase-root-ca.pem"
          tls_probe "$(pooler_host)" "$RUNNER_TEMP/supabase-root-ca.pem" | tee "$RUNNER_TEMP/tls.txt"

      - name: Run suite ${{ inputs.suite }} (the only step that receives the password)
        env:
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          . .github/hosted-verification/checks.sh
          [ -n "${DB_PASSWORD:-}" ] || fail "Environment secret STAGING_DB_PASSWORD is not set"
          CA_FILE="$RUNNER_TEMP/db-ca.pem"
          write_ca "$CA_FILE"
          # Connection string, built here only and masked before anything else is printed (same construction and checks
          # as the migration workflow). It is passed to the runner process only, never written to a file or the summary.
          enc="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')"
          echo "::add-mask::$enc"
          DB_URL="${POOLER_URL/\[YOUR-PASSWORD\]/$enc}?sslmode=verify-full&sslrootcert=$CA_FILE"
          echo "::add-mask::$DB_URL"
          unset DB_PASSWORD enc
          case "$DB_URL" in *"$PRODUCTION_REF"*) fail "the final connection string names the PRODUCTION project" ;; esac
          case "$DB_URL" in "postgresql://postgres.$EXPECTED_TEST_REF:"*|"postgres://postgres.$EXPECTED_TEST_REF:"*) ;; *) fail "the final connection string is not for $EXPECTED_TEST_REF" ;; esac
          case "$DB_URL" in *"@$(pooler_host):5432/postgres?sslmode=verify-full&sslrootcert=$CA_FILE") ;; *) fail "the final connection string does not require verify-full against the pinned roots" ;; esac
          [ "$(printf '%s' "$DB_URL" | grep -o 'sslmode=' | wc -l)" = 1 ] || fail "the final connection string sets sslmode more than once"
          mkdir -p "$RUNNER_TEMP/evidence"
          rc=0
          HV_DB_URL="$DB_URL" HV_CA_FILE="$CA_FILE" HV_OUT="$RUNNER_TEMP/evidence" HV_SUITE="$SUITE" \
            HV_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            HV_APPROVAL_RESULT="$(cat "$RUNNER_TEMP/approval.txt")" HV_TLS_RESULT="$(tail -1 "$RUNNER_TEMP/tls.txt")" \
            "$RUNNER_TEMP/venv/bin/python" -I .github/hosted-verification/hv.py > "$RUNNER_TEMP/runner.out" 2>&1 || rc=$?
          unset DB_URL
          cat "$RUNNER_TEMP/runner.out"
          {
            echo "### Suite $SUITE - staging project \`$EXPECTED_TEST_REF\`"
            echo "- Commit \`$COMMIT\`, run $GITHUB_RUN_ID, attempt 1"
            sed -n 's/^verdict: /- **Verdict:** /p; s/^evidence: /- Evidence: /p; s/^HARD FAIL: /- **Refused:** /p' "$RUNNER_TEMP/runner.out"
            echo "- Evidence files are in this run's artifact. A verdict other than PASS is reported, never converted into a pass."
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "Suite $SUITE: PASS. Next: report to the owner and STOP." ;;
            2) fail "suite $SUITE finished with a verdict other than PASS (see the evidence)" ;;
            *) fail "suite $SUITE was refused or failed (status $rc; see above)" ;;
          esac

      - name: Upload the evidence (written and checked for secrets by the runner)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: hosted-verification-${{ inputs.suite }}-run${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 90
