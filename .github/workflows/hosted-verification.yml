# Gearhead Labs STAGING - hosted verification (A4 of the hosted TEST verification procedure, revision 10)
# File: .github/workflows/hosted-verification.yml in highandmighty354-dev/gearhead-labs-staging ONLY.
#
# What this workflow can do: run ONE selected Revision 10 test suite (P1-P2, D1, D3, D4, D2, P3 or P4) against the ONE
# staging (TEST) project named in this repository's settings, after you approve the run, and keep the evidence as a
# downloadable artifact. HTTP requests go only to https://<TEST_REF>.supabase.co/functions/v1/(analytics-ingest |
# b1-chunk-probe); database connections go only to the staging Session pooler, with verify-full TLS against the
# pinned Supabase roots. Runner: .github/hosted-verification/hv.py (see the README next to it).
# What it cannot do: start on its own (manual start only), run more than one suite, deploy or configure anything,
# change function settings, use a service-role key, insert into analytics tables directly, or reach production
# (production's ref is refused everywhere and production's password is not in this repository).
#
# Order of every run:
#   preflight  (no Environment, no secret)  context, typed ref, four-way target check, TEST origin, the suite's
#                                           prerequisites, Environment protection, no other staging run active,
#                                           TLS certificate + hostname probe of the database pooler. No HTTP request.
#   verify     (Environment staging-db)     WAITS FOR YOUR APPROVAL, then repeats every check in steps that have no
#                                           secret, installs the hash-pinned database driver, and only the last test
#                                           step receives the staging database password. Evidence is uploaded after.

name: Hosted verification (manual, approval-gated)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "The ONE Revision 10 test suite to run. P1-P2 is read-only. D1/D3 need the A9 probe. D4, D2, P3, P4 need the A7 receiver and the A8 test window."
        type: choice
        options: ["P1-P2", "D1", "D3", "D4", "D2", "P3", "P4"]
        required: true
      confirm_project_ref:
        description: "Type the STAGING project ref exactly (20 lowercase letters/digits). Production's ref is always refused."
        type: string
        required: true

# No permissions at workflow level; each job asks only for read access.
permissions: {}

# One run at a time; a queued run never cancels a running test.
concurrency:
  group: hosted-verification
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # GitHub runs this as: bash --noprofile --norc -eo pipefail {0}

env:
  STAGING_REPOSITORY: "highandmighty354-dev/gearhead-labs-staging"
  PRODUCTION_REF: "jmztpjudwzjvrcdtjynd"     # always refused, everywhere
  NO_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Approval gate this workflow requires (read back from GitHub before anything runs; see check_environment).
