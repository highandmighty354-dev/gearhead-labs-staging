# Gearhead Labs STAGING - hosted validation of the staging site and staging database (checks S1-S4 of the staging plan)
# File: .github/workflows/staging-validation.yml in highandmighty354-dev/gearhead-labs-staging ONLY.
#
# Validation package Draft 3 (package SHA-256 31c1b1c90b580110f5396ad34ec8b640d0e814c527b02d80582cb738d992b027),
# committed to this repository through PR #1, plus two owner-approved corrections made in PR #1 after Draft 3: this header,
# and a stricter staging-address guard in .github/validation/site_check.mjs (re-pinned below).
# Runs only when started by hand from main, after PR #1 is merged and GitHub Pages is turned on, and its database job
# waits for the owner's approval on every run. Its files in .github/validation/ are hash-pinned below.
#
# What it checks, all against the ONE staging project pinned below:
#   preflight   (no secret)                 how the run started, the typed project ref, the pinned staging target, the 21
#                                           migration files, the validation files, the approval gate, the Pages build of
#                                           THIS commit, and the database's TLS certificate (no password)
#   repo-tests  (no secret)                 fast gate (9 steps) and the full browser regression (51 suites), including the
#                                           4 suites that need old file versions, which come from a hash-pinned history pack
#   site        (no secret)                 A1 served files = this commit; A2 served config = staging only; A4 every page
#                                           noindex and no Markdown published; A3 the live page connects to staging with
#                                           0 errors; B2 known-answer suite on the SERVED engine; S3 anonymous web-API
#                                           requests are all refused
#   database    (Environment staging-db)    WAITS FOR YOUR APPROVAL. Protection audit against a replica built from the
#                                           migration files, two-user access matrix in a transaction that cannot commit,
#                                           formula-version checks, before/after counts. Only ONE step gets the password.
# What it cannot do: start on its own, run on another branch or repository, re-run, deploy, push, or reach any project
# other than the pinned staging project. It changes nothing: every database write happens inside one transaction that
# always ends in a deliberate error (rolled back), and the before/after counts prove it.
# Not covered here (stay manual or connector checks, see the plan): the Supabase security advisor, real email sign-in,
# phone layout, two-tab defects GH-DEF-070/071, and production's state.

name: Staging validation (manual, approval-gated)

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the STAGING project ref exactly (20 lowercase letters/digits)."
        type: string
        required: true

permissions: {}            # nothing at workflow level; each job asks for the least it needs

# Shared lock with staging-migrations.yml. GitHub concurrency groups are repository-wide, so using the SAME group name as
# the committed migration workflow means a validation run and a migration run can never be in progress together: whichever
# starts second waits as "pending" until the first finishes. Neither workflow cancels a running run (cancel-in-progress:
# false). GitHub keeps at most one waiting run per group; a newer waiting run replaces an older one, and the replaced run
# is cancelled before it started anything. check_shared_lock refuses to run unless both files still declare this lock.
concurrency:
  group: staging-migrations
  cancel-in-progress: false

defaults:
  run:
    shell: bash            # bash --noprofile --norc -eo pipefail {0}

env:
  STAGING_REPOSITORY: "highandmighty354-dev/gearhead-labs-staging"
  STAGING_REF: "npizzzfvbtrlpnxfhqks"                                        # the ONLY project this workflow accepts
  STAGING_SITE_URL: "https://highandmighty354-dev.github.io/gearhead-labs-staging/"
  SHARED_LOCK_GROUP: "staging-migrations"                                    # concurrency group shared with staging-migrations.yml
  APPROVAL_ENVIRONMENT: "staging-db"
  APPROVER_LOGIN: "highandmighty354-dev"
  PLAYWRIGHT_VERSION: "1.63.0"                                               # same pin as the calculator test workflow
